name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      frontend_dir: ${{ steps.gate.outputs.frontend_dir }}
      build_dir: ${{ steps.gate.outputs.build_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate trigger
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          should_deploy="false"
          frontend_dir=""
          build_dir="dist"

          if [ -f frontend/package.json ]; then
            frontend_dir="frontend"
          elif [ -f package.json ]; then
            frontend_dir="."
          fi

          if [ -z "$frontend_dir" ]; then
            echo "No deployable frontend package.json found."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_deploy="true"
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_CONCLUSION" = "success" ] && [ "$WORKFLOW_HEAD_BRANCH" = "main" ]; then
            should_deploy="true"
          fi

          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "frontend_dir=$frontend_dir" >> "$GITHUB_OUTPUT"
          echo "build_dir=$build_dir" >> "$GITHUB_OUTPUT"

  deploy-pages:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend directory
        shell: bash
        working-directory: ${{ needs.gate.outputs.frontend_dir }}
        run: |
          if [ ! -f package.json ]; then
            echo "package.json was not found in $PWD"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ needs.gate.outputs.frontend_dir }}/package-lock.json

      - name: Install dependencies
        shell: bash
        working-directory: ${{ needs.gate.outputs.frontend_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate build script
        shell: bash
        working-directory: ${{ needs.gate.outputs.frontend_dir }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); if (!pkg.scripts || !pkg.scripts.build) { console.error('Missing frontend build script'); process.exit(1); }"

      - name: Build frontend
        working-directory: ${{ needs.gate.outputs.frontend_dir }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ needs.gate.outputs.frontend_dir }}/${{ needs.gate.outputs.build_dir }}

      - id: deployment
        uses: actions/deploy-pages@v4

  cd-disabled:
    needs: gate
    if: needs.gate.outputs.should_deploy != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report why deployment was skipped
        shell: bash
        run: |
          echo "CD is disabled or not eligible for this run."
          echo "A frontend package.json must exist and CI must succeed on main, or run this workflow manually after the frontend is added."