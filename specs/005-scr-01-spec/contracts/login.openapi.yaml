openapi: 3.0.3
info:
  title: Login API
  version: 1.0.0
  description: Contract for SCR-01 login with session start and dashboard redirect.
servers:
  - url: https://api.example.com
paths:
  /auth/login:
    post:
      summary: Authenticate a user and start session
      operationId: loginAccount
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded and session started
          headers:
            Set-Cookie:
              description: Session cookie (24h)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccess'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  value:
                    errorCode: VALIDATION_FAILED
                    message: 入力内容を確認してください。
                    fieldErrors:
                      email: メールアドレスの形式を確認してください。
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  value:
                    errorCode: INVALID_CREDENTIALS
                    message: メールアドレスまたはパスワードが正しくありません。
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds until next retry
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                too_many_requests:
                  value:
                    errorCode: RATE_LIMIT_EXCEEDED
                    message: しばらく待ってから再試行してください。
        '500':
          description: Login failed without partial success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                server_error:
                  value:
                    errorCode: LOGIN_FAILED
                    message: ログインに失敗しました。再試行してください。
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Raw user email; backend applies trim+lowercase normalization.
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: Password policy is length only (8-64), no character class requirements.
    LoginSuccess:
      type: object
      required:
        - userId
        - redirectTo
        - sessionExpiresInSeconds
      properties:
        userId:
          type: string
        redirectTo:
          type: string
          example: /dashboard
        sessionExpiresInSeconds:
          type: integer
          example: 86400
    ErrorResponse:
      type: object
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          enum:
            - VALIDATION_FAILED
            - INVALID_CREDENTIALS
            - RATE_LIMIT_EXCEEDED
            - LOGIN_FAILED
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string